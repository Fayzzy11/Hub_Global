<!doctype html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Hub · Noah</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#18202F">
<link rel="icon" href="assets/icone-192.png">
<link rel="apple-touch-icon" href="assets/icone-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   HUB · Noah : direction « Observatoire clair »
   Papier ivoire, encre, or. Titres en Fraunces, texte en IBM Plex.
   ============================================================ */
:root{
  --fond:#F5F0E6; --papier:#FCFAF4; --encre:#18202F; --encre2:#4A5263; --doux:#857F70;
  --trait:#DCD3C0; --or:#A87B1E; --or-doux:#F0E5C8; --hausse:#28734F; --baisse:#B2452F; --bleu:#27457A;
  --ombre:0 1px 0 rgba(24,32,47,.04),0 14px 34px -20px rgba(24,32,47,.28);
  --titre:"Fraunces",Georgia,"Times New Roman",serif;
  --texte:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
[data-theme="nuit"]{
  --fond:#0E1420; --papier:#161D2C; --encre:#EDE7D8; --encre2:#BDB8AA; --doux:#8791A6;
  --trait:#2B3449; --or:#D9B25A; --or-doux:#352E1C; --hausse:#63C598; --baisse:#EC866E; --bleu:#93B3EC;
  --ombre:0 14px 34px -20px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--fond);color:var(--encre);font:15px/1.55 var(--texte);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--titre);font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
h1{font-size:clamp(26px,3.2vw,38px);line-height:1.1}
h2{font-size:21px} h3{font-size:17px}
p{margin:0 0 .7em} a{color:var(--bleu)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--or);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sur{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--doux)}
.doux{color:var(--doux)} .petit{font-size:13px}

/* ---------- Structure générale ---------- */
.app{display:grid;grid-template-columns:214px 1fr;height:100dvh}
nav.rail{border-right:1px solid var(--trait);padding:26px 0 18px;display:flex;flex-direction:column;background:var(--fond);z-index:5}
.marque{padding:0 24px 22px;font-family:var(--titre);font-size:24px;line-height:1}
.marque small{display:block;margin-top:8px}
.liens{display:flex;flex-direction:column;overflow:auto;flex:1}
.liens a{display:flex;gap:12px;align-items:baseline;padding:9px 24px;text-decoration:none;color:var(--encre2);border-left:2px solid transparent}
.liens a .n{font:11px var(--mono);color:var(--doux);width:18px}
.liens a:hover{color:var(--encre)}
.liens a[aria-current="page"]{color:var(--encre);border-left-color:var(--or);background:linear-gradient(90deg,var(--or-doux),transparent 70%)}
.pied{padding:14px 24px 0;font-size:12px;color:var(--doux);border-top:1px solid var(--trait)}
main{position:relative;overflow:hidden;min-width:0}
.vue{display:none;height:100%;overflow:auto;padding:34px clamp(18px,4vw,52px) 60px}
.vue.active{display:block}
.vue>header{margin-bottom:24px;max-width:980px}
.vue>header p{color:var(--encre2);margin-top:8px;max-width:70ch}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  nav.rail{order:2;min-width:0;border-right:0;border-top:1px solid var(--trait);padding:0 0 env(safe-area-inset-bottom)}
  .marque,.pied{display:none}
  .liens{flex-direction:row;overflow-x:auto;scrollbar-width:none}
  .liens a{padding:13px 14px;border-left:0;border-top:2px solid transparent;white-space:nowrap;font-size:14px}
  .liens a .n{display:none}
  .liens a[aria-current="page"]{border-top-color:var(--or);background:none}
  .vue{padding:22px 16px 40px}
}

/* ---------- Éléments communs ---------- */
.carte{background:var(--papier);border:1px solid var(--trait);border-radius:10px;padding:18px 20px;box-shadow:var(--ombre)}
.grille{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.btn{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 14px;border:1px solid var(--trait);border-radius:8px;background:var(--papier);cursor:pointer;text-decoration:none;color:var(--encre);font-weight:500;font-size:14px}
.btn:hover{border-color:var(--encre2)}
.btn.plein{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.btn.or{border-color:var(--or);color:var(--or)}
.btn.mini{min-height:30px;padding:3px 10px;font-size:13px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.rang{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.puce{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--trait);border-radius:99px;color:var(--encre2);background:transparent}
button.puce{cursor:pointer} button.puce:hover{border-color:var(--encre2)}
.puce.or{border-color:var(--or);color:var(--or)}
.puce i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.champ{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--encre2)}
.champ input,.champ select,.champ textarea,input.saisie,select.saisie{background:var(--papier);border:1px solid var(--trait);border-radius:8px;padding:9px 11px;min-height:40px;color:var(--encre);font-size:15px;width:100%}
.champ textarea{min-height:92px;resize:vertical;line-height:1.45}
.vide{border:1px dashed var(--trait);border-radius:10px;padding:28px 20px;text-align:center;color:var(--doux)}
.vide b{display:block;font-family:var(--titre);font-weight:500;font-size:18px;color:var(--encre2);margin-bottom:4px}
.bandeau{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;border:1px solid var(--or);background:var(--or-doux);border-radius:10px;margin-bottom:18px;font-size:14px}
.liste{margin:0;padding:0;list-style:none}
.liste li{padding:6px 0 6px 16px;position:relative;border-bottom:1px solid var(--trait)}
.liste li:last-child{border-bottom:0}
.liste li::before{content:"";position:absolute;left:0;top:15px;width:6px;height:1px;background:var(--or)}
.hausse{color:var(--hausse)} .baisse{color:var(--baisse)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(20px);background:var(--encre);color:var(--fond);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw}
#toast.vu{opacity:1;transform:translateX(-50%)}
details.menu{position:relative}
details.menu>summary{list-style:none}
details.menu>summary::-webkit-details-marker{display:none}
details.menu>div{position:absolute;z-index:20;top:44px;left:0;min-width:210px;max-height:320px;overflow:auto;background:var(--papier);border:1px solid var(--trait);border-radius:10px;box-shadow:var(--ombre);padding:10px 12px;display:flex;flex-direction:column;gap:7px}
label.coche{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer}
label.coche input{width:17px;height:17px;accent-color:var(--or)}

/* ---------- Univers ---------- */
#v-univers{padding:0;overflow:hidden}
#u-scene{position:absolute;inset:0;touch-action:none;cursor:grab;isolation:isolate}
#u-scene:active{cursor:grabbing}
#u-canvas{width:100%;height:100%;display:block}
#u-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
/* La scène 3D est traitée comme une image de cinéma : textes clairs posés dessus, voile sombre à gauche pour la lisibilité */
#v-univers:not(.plan){--encre:#F6F1E6;--encre2:rgba(246,241,230,.76);--doux:rgba(246,241,230,.58);--trait:rgba(255,255,255,.18);--papier:rgba(11,15,25,.72);--fond:#0B0F19;--or:#EBC66E;--or-doux:rgba(235,198,110,.16);--hausse:#7FE2B0;--baisse:#FF9E88;--ombre:0 18px 40px -22px rgba(0,0,0,.8);color:var(--encre);background:#0B0F19}
/* Étiquette d'une tour : numéro, nom et l'information du moment, accrochés à droite de son enseigne */
.u-noeud{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:0;cursor:pointer;white-space:nowrap;color:#fff;text-align:left;transform-origin:0 50%;will-change:transform;transition:opacity .25s}
.u-noeud b{display:flex;flex-direction:column;gap:4px;font:600 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;background:rgba(9,13,22,.66);border-left:2px solid var(--c,#fff);border-radius:1px 5px 5px 1px;padding:5px 9px 5px 8px}
.u-noeud b .n{font-style:normal;color:color-mix(in srgb,var(--c,#fff) 50%,#fff);margin-right:7px}
.u-noeud b small{display:none;font:400 10.5px/1.15 var(--texte);letter-spacing:.01em;text-transform:none;color:rgba(255,255,255,.82);max-width:210px;overflow:hidden;text-overflow:ellipsis}
.u-noeud.vif b small,.u-noeud:hover b small,.u-noeud:focus-visible b small{display:block}
.u-noeud.vif,.u-noeud:hover{z-index:999998!important}
.u-noeud.vif b,.u-noeud:hover b,.u-noeud:focus-visible b{background:color-mix(in srgb,var(--c,#18202F) 82%,#000)}
.u-noeud.vif b .n,.u-noeud:hover b .n{color:#fff}
.u-noeud.attenue{opacity:.22}
.u-noeud .pt{display:inline-block;width:6px;height:6px;border-radius:50%;background:#F0B93A;margin-left:7px;vertical-align:1px;box-shadow:0 0 8px #F0B93A}
/* Fiche ouverte : le titre s'efface pour laisser toute la scène au neurone choisi */
.u-tete{transition:opacity .35s}
body:has(#fiche.ouverte) #v-univers:not(.plan) .u-tete{opacity:0;pointer-events:none}
body:has(#fiche.ouverte) #v-univers:not(.plan) .u-tete>*{pointer-events:none}
#u-bulle{position:absolute;left:0;top:0;width:264px;background:var(--papier);border:1px solid var(--trait);border-radius:12px;padding:12px 14px;box-shadow:var(--ombre);font-size:13px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:999999}
#u-bulle.vu{opacity:1} #u-bulle b{font:500 16px/1.15 var(--titre)} #u-bulle p{margin:8px 0 0;color:var(--encre2)}
.tuile{--c:var(--encre);position:relative;flex:none;width:54px;height:54px;border-radius:15px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 74%,#fff),var(--c));border:1.5px solid color-mix(in srgb,var(--c) 80%,#000);color:#fff;display:grid;place-items:center;box-shadow:0 10px 20px -12px rgba(10,14,22,.8);font:600 19px/1 var(--titre)}
.tuile svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tuile img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:6px;border-radius:13px;background:#fff}
.tuile.petite{width:40px;height:40px;border-radius:11px;font-size:15px;box-shadow:none}
.tuile.petite svg{width:21px;height:21px}
.neuf{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#E0A526;border:2px solid var(--papier);animation:pouls 1.8s ease-in-out infinite}
@keyframes pouls{50%{transform:scale(1.35);opacity:.55}}
.u-voile{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(6,9,16,.8) 0,rgba(6,9,16,.52) 26%,rgba(6,9,16,0) 58%),linear-gradient(180deg,rgba(6,9,16,.3) 0,rgba(6,9,16,0) 20%,rgba(6,9,16,0) 74%,rgba(6,9,16,.6) 100%)}
/* Les chiffres qui comptent, en ligne sous le titre */
.u-hud{display:flex;gap:14px 28px;flex-wrap:wrap;margin-top:28px}
.u-hud button{display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:9px;background:none;border:0;border-top:1px solid var(--trait);padding:13px 0 0;min-width:84px;text-align:left;cursor:pointer;color:var(--encre)}
.u-hud button:hover{border-top-color:var(--encre)}
.u-hud b{display:block;font:600 clamp(21px,2.1vw,30px)/1 var(--texte);letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.u-hud b small{display:block;font:400 11.5px/1.2 var(--texte);letter-spacing:0;color:var(--encre2);margin-top:5px;max-width:132px;overflow:hidden;text-overflow:ellipsis}
.u-hud b.alerte{color:var(--or)} .u-hud b.hausse{color:var(--hausse)} .u-hud b.baisse{color:var(--baisse)}
#v-univers.plan .u-hud{display:none}
.u-aide{font-size:12px;color:var(--encre2)}
.puce[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.u-legende .puce{background:var(--papier)} .u-legende .puce[aria-pressed="true"]{background:var(--encre);color:var(--fond);border-color:var(--encre)}
.u-tete{position:absolute;left:clamp(18px,4.4vw,60px);top:clamp(26px,9vh,84px);max-width:min(600px,86vw);pointer-events:none}
.u-tete>*{pointer-events:auto}
.u-tete h1{font-size:clamp(34px,4.7vw,66px);line-height:.98;letter-spacing:-.022em;margin-top:18px;font-weight:500}
.u-tete h1 em{font-weight:400}
.u-tete p{color:var(--encre2);margin-top:18px;max-width:400px;font-size:14.5px;line-height:1.55}
#v-univers.plan .u-tete{top:30px} #v-univers.plan .u-tete h1{font-size:clamp(26px,3.2vw,38px);line-height:1.1;margin-top:8px} #v-univers.plan .u-tete h1 br{display:none}
#v-univers:not(.plan) .u-outils .btn{backdrop-filter:blur(8px)}
.u-recents{margin-top:16px;display:none;flex-direction:column;gap:2px;align-items:flex-start}
.u-recents button{background:none;border:0;padding:3px 0;cursor:pointer;font-size:13px;color:var(--encre);text-align:left}
.u-recents button:hover{color:var(--encre)}
.u-outils{position:absolute;right:16px;bottom:16px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.u-legende{position:absolute;left:clamp(16px,4vw,48px);bottom:18px;display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--encre2);max-width:62%}
.u-legende i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
#u-liste{position:absolute;inset:0;overflow:auto;padding:160px clamp(18px,4.4vw,60px) 80px;display:none;background:var(--fond)}
#v-univers.plan #u-liste{display:block}
#v-univers.plan #u-scene,#v-univers.plan .u-legende,#v-univers.plan .u-voile{display:none}
.u-legende .puce{background:var(--papier)}
.noeud{cursor:pointer;text-align:left;width:100%;display:block}
.noeud:hover{border-color:var(--encre2)}
@media (max-width:820px){.u-tete{top:18px;right:16px;max-width:none}.u-tete h1{font-size:30px;margin-top:10px}.u-tete p{margin-top:10px;font-size:13.5px}.u-recents{display:none}.u-aide{display:none}.u-legende{max-width:none;right:16px;bottom:62px}
  .u-hud{flex-wrap:nowrap;gap:22px;margin-top:16px;overflow-x:auto;scrollbar-width:none}.u-hud button{flex:none;padding-top:10px;gap:7px}.u-hud b{font-size:19px}.u-hud b small{font-size:11px}#u-liste{padding-top:120px}
  .u-voile{background:linear-gradient(180deg,rgba(6,9,16,.82) 0,rgba(6,9,16,.5) 24%,rgba(6,9,16,0) 46%,rgba(6,9,16,0) 72%,rgba(6,9,16,.66) 100%)}.u-noeud b small{display:none}}

/* ---------- Calendrier ---------- */
.cal-barre{justify-content:space-between;margin-bottom:12px}
.cal-corps{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.cal-grille{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--trait);border-radius:12px;overflow:hidden;background:var(--papier);box-shadow:var(--ombre)}
.cal-tete{padding:9px 8px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--doux);border-bottom:1px solid var(--trait)}
.cal-jour{min-height:104px;padding:6px 6px 8px;border-right:1px solid var(--trait);border-bottom:1px solid var(--trait);cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-jour:nth-child(7n){border-right:0} .cal-jour:hover{background:color-mix(in srgb,var(--or-doux) 55%,transparent)}
.cal-jour:focus-visible{outline:2px solid var(--or);outline-offset:-2px}
.cal-jour.hors{background:color-mix(in srgb,var(--fond) 60%,transparent)} .cal-jour.hors .num{color:var(--doux);opacity:.6}
.cal-jour .num{font:500 13px/1 var(--mono);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-jour.auj .num{background:var(--encre);color:var(--fond)} .cal-jour.choisi{box-shadow:inset 0 0 0 2px var(--or)}
.cal-evs{display:flex;flex-direction:column;gap:3px;min-width:0}
.cal-ev{display:flex;align-items:center;gap:5px;min-width:0;padding:3px 6px;border-radius:6px;font-size:12px;line-height:1.2;background:color-mix(in srgb,var(--c) 16%,var(--papier));border-left:3px solid var(--c);color:var(--encre);cursor:pointer}
.cal-ev:hover{background:color-mix(in srgb,var(--c) 30%,var(--papier))}
.cal-ev svg{flex:none;width:13px;height:13px;fill:none;stroke:var(--c);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-ev i{font:500 10.5px/1 var(--mono);font-style:normal;color:var(--encre2)} .cal-ev b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-plus{font:500 11px/1 var(--mono);color:var(--doux);padding-left:6px}
.cal-cote{display:grid;gap:16px}
.cal-ligne{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--trait)} .cal-cote .carte .cal-ligne:first-of-type{border-top:0}
.cal-ligne>div{min-width:0;display:flex;flex-direction:column;gap:2px}
.cal-tuile{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 76%,#fff),var(--c));color:#fff}
.cal-tuile svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cal-vues{display:inline-flex;border:1px solid var(--trait);border-radius:8px;overflow:hidden;background:var(--papier)}
.cal-vues button{border:0;background:none;padding:0 13px;min-height:36px;font-size:14px;font-weight:500;color:var(--encre2);cursor:pointer} .cal-vues button+button{border-left:1px solid var(--trait)}
.cal-vues button[aria-pressed="true"]{background:var(--encre);color:var(--fond)}
.cal-sem{border:1px solid var(--trait);border-radius:12px;overflow:hidden;background:var(--papier);box-shadow:var(--ombre);min-width:0}
.cal-sem-tete,.cal-sem-jour,.cal-sem-corps{display:grid;grid-template-columns:52px repeat(var(--n),minmax(0,1fr))}
.cal-sem-tete{border-bottom:1px solid var(--trait)}
.cal-sem-tete button{border:0;border-left:1px solid var(--trait);background:none;padding:9px 4px;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--doux);cursor:pointer;display:flex;gap:7px;align-items:center;justify-content:center}
.cal-sem-tete b{font:500 13px/1 var(--mono);letter-spacing:0;width:24px;height:24px;display:grid;place-items:center;border-radius:50%;color:var(--encre)}
.cal-sem-tete .auj b{background:var(--encre);color:var(--fond)} .cal-sem-tete .choisi{box-shadow:inset 0 -2px 0 var(--or)}
.cal-sem-jour{border-bottom:1px solid var(--trait);min-height:30px} .cal-sem-jour>div{border-left:1px solid var(--trait);padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer}
.cal-h{font:500 10.5px/1 var(--mono);color:var(--doux);padding:5px 6px 0 0;text-align:right}
.cal-sem-corps{position:relative} .cal-heures{position:relative} .cal-heures .cal-h{position:absolute;right:0;transform:translateY(-1px)}
.cal-col{position:relative;border-left:1px solid var(--trait);cursor:cell;background:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--hh) - 1px),var(--trait) calc(var(--hh) - 1px),var(--trait) var(--hh))}

.cal-bloc{position:absolute;overflow:hidden;border-radius:6px;padding:4px 7px;background:var(--c);color:#fff;font-size:12px;line-height:1.25;cursor:pointer;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 0 rgba(0,0,0,.12)}
.cal-bloc:hover{filter:brightness(1.1)} .cal-bloc .h{font:500 10.5px/1.2 var(--mono);opacity:.92;display:flex;gap:4px;align-items:center;white-space:nowrap}
.cal-bloc .h svg{flex:none;width:12px;height:12px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cal-bloc b{font-weight:600} .cal-bloc .l{opacity:.85;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-bloc.court{flex-direction:row;gap:6px;align-items:center;padding:1px 7px} .cal-bloc.court b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .cal-bloc.court .l{display:none}
.cal-maint{position:absolute;left:0;right:0;height:2px;background:var(--baisse);pointer-events:none} .cal-maint::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--baisse)}
#v-calendrier .puce[aria-pressed="false"]{opacity:.45;text-decoration:line-through}
@media (max-width:1100px){.cal-corps{grid-template-columns:1fr}}
@media (max-width:700px){.cal-jour{min-height:58px;padding:4px 2px 6px;align-items:center}.cal-evs{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .cal-ev{padding:0;width:8px;height:8px;border-radius:50%;border:0;background:var(--c)}.cal-ev svg,.cal-ev i,.cal-ev b{display:none}.cal-plus{font-size:9px;padding:0}.cal-tete{padding:8px 0;text-align:center;letter-spacing:.04em}
  .cal-barre h2{font-size:19px}#v-calendrier>header p{display:none}
  .cal-sem-tete,.cal-sem-jour,.cal-sem-corps{grid-template-columns:34px repeat(var(--n),minmax(0,1fr))}.cal-h{font-size:9px;padding-right:3px}.cal-sem-tete button{flex-direction:column;gap:3px;letter-spacing:.02em;padding:7px 0}
  .cal-sem[style*="--n:7"] .cal-bloc{padding:2px 3px;font-size:9.5px;line-height:1.15}.cal-sem[style*="--n:7"] .cal-bloc .h,.cal-sem[style*="--n:7"] .cal-bloc .l{display:none}.cal-sem[style*="--n:7"] .cal-bloc b{font-weight:500;overflow-wrap:anywhere}.cal-sem[style*="--n:7"] .cal-sem-jour .cal-ev{margin:auto}}

/* ---------- Fiche (panneau latéral) ---------- */
#fiche{position:absolute;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--papier);border-left:1px solid var(--trait);box-shadow:var(--ombre);transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:30;overflow:auto;padding:24px 24px 40px}
#fiche.ouverte{transform:none}
#fiche h4{font:500 11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--doux);margin:20px 0 6px}
#fiche .fermer{position:sticky;top:0;float:right}
@media (max-width:820px){#fiche{top:auto;height:78%;width:100%;border-left:0;border-top:1px solid var(--trait);border-radius:16px 16px 0 0;transform:translateY(104%)}}

/* ---------- Agent ---------- */
.chat{max-width:780px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:12px;max-width:92%}
.msg.moi{align-self:flex-end;background:var(--encre);color:var(--fond)}
.msg.agent{align-self:flex-start;background:var(--papier);border:1px solid var(--trait)}
.msg .rang{margin-top:10px}
.saisie-chat{max-width:780px;display:flex;gap:8px;margin-top:16px;position:sticky;bottom:-40px;background:var(--fond);padding:10px 0 14px}

/* ---------- Marché ---------- */
.table-zone{overflow-x:auto;border:1px solid var(--trait);border-radius:10px;background:var(--papier)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--doux);text-align:right;padding:12px 14px;border-bottom:1px solid var(--trait);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--trait);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
.notes-c{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:13px;line-height:1.45}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--papier)}
td:first-child b{font-weight:500;display:block}
td:first-child span{font:11px var(--mono);color:var(--doux)}
.seg{display:inline-flex;border:1px solid var(--trait);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--papier);padding:8px 13px;cursor:pointer;font:500 13px var(--mono)}
.seg button[aria-pressed="true"]{background:var(--encre);color:var(--fond)}

/* ---------- Cartes de marché (treemap) ---------- */
:root{--neutre:#DAD3C3} [data-theme="nuit"]{--neutre:#2A3346}
#hm{position:relative;border-radius:10px;overflow:hidden;background:var(--papier);border:1px solid var(--trait)}
.hm-c{position:absolute;border:0;margin:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;line-height:1.08;cursor:pointer;font-family:var(--texte);box-shadow:inset 0 0 0 1px var(--papier);outline-offset:-3px}

.hm-c:hover{filter:brightness(1.08)}
.hm-sec{position:absolute;height:17px;font:500 10px/17px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:0 6px;overflow:hidden;white-space:nowrap;background:var(--encre);color:var(--fond);box-shadow:inset 0 0 0 1px var(--papier)}
.hm-ech{display:inline-flex;align-items:center;gap:8px;font:11px var(--mono);color:var(--doux)}
.hm-ech i{display:inline-block;width:120px;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--baisse),var(--neutre),var(--hausse))}

/* ---------- Cours ---------- */
.deux{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:20px;align-items:start}
@media (max-width:900px){.deux{grid-template-columns:1fr}}
.c-item{display:block;width:100%;text-align:left;cursor:pointer;margin-bottom:10px}
.c-item[aria-current="true"]{border-color:var(--or);box-shadow:inset 3px 0 0 var(--or),var(--ombre)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}

details.note{border-top:1px solid var(--trait);padding:10px 0}
details.note summary{cursor:pointer;font-weight:500}

/* ---------- Dialogues ---------- */
dialog.grand[open]{display:flex;flex-direction:column;width:min(1100px,96vw);height:92dvh;padding:14px}
dialog.grand iframe,dialog.grand img{flex:1;min-height:0;width:100%;border:1px solid var(--trait);border-radius:8px;background:#fff;object-fit:contain}
dialog{border:1px solid var(--trait);border-radius:14px;background:var(--papier);color:var(--encre);padding:24px;width:min(620px,94vw);max-height:90dvh;box-shadow:var(--ombre)}
dialog::backdrop{background:rgba(24,32,47,.4)}
dialog form{display:grid;gap:12px}
#verrou{position:fixed;inset:0;background:var(--fond);z-index:80;display:none;place-items:center;padding:20px}
#verrou.vu{display:grid}
#verrou form{width:min(400px,100%);display:grid;gap:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============================================================
   3. Coffre : chiffrement AES-GCM 256, clé dérivée de la
      passphrase par PBKDF2-SHA256 (600 000 itérations).
      Tout se passe dans le navigateur (Web Crypto).
   ============================================================ */
const ITER = 600000;
const b64 = buf => { let s = ""; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 8192) s += String.fromCharCode(...u.subarray(i, i + 8192)); return btoa(s); };
const d64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const cles = new Map(); // cache des clés dérivées (une dérivation coûte environ 0,3 s)
async function cle(pass, selB64, iter) {
  const k = pass + "|" + selB64 + "|" + iter;
  if (!cles.has(k)) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    cles.set(k, await crypto.subtle.deriveKey({ name: "PBKDF2", salt: d64(selB64), iterations: iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]));
  }
  return cles.get(k);
}
let selSession = null;
async function chiffrer(obj, pass) {
  selSession ??= b64(crypto.getRandomValues(new Uint8Array(16)));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await cle(pass, selSession, ITER), new TextEncoder().encode(JSON.stringify(obj)));
  return { hub_chiffre: 1, algo: "AES-GCM-256", kdf: "PBKDF2-SHA256", iterations: ITER, sel: selSession, iv: b64(iv), donnees: b64(ct) };
}
async function dechiffrer(env, pass) {
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: d64(env.iv) }, await cle(pass, env.sel, env.iterations || ITER), d64(env.donnees));
  return JSON.parse(new TextDecoder().decode(pt));
}
const estChiffre = o => !!(o && o.hub_chiffre && o.donnees);

  if (c?.jeton) GH.jeton = c.jeton;
  S.demo = !GH.pret;
  await Promise.all(Object.keys(JEUX).map(chargerJeu));
  demarrer();
}
async function chargerJeu(n) {
  const J = JEUX[n]; let d = null; M[n] = { source: "absent", attente: false, erreur: "" };
  if (!J.prive) { d = await recuperer(`data/${n}.json`); M[n].source = d ? "dépôt de l'app" : "absent"; if (!d && S.demo && DEMO?.[n]) { d = DEMO[n]; M[n].source = "démo"; } }
  else if (GH.pret) {
    try { const r = await GH.lire(`data/${n}.json`); if (r) { d = JSON.parse(r.texte); GH.shas[n] = r.sha; M[n].source = "dépôt privé"; LS.ecrire("hub.cache." + n, d); } else M[n].source = "nouveau fichier"; }
    catch (e) { M[n].erreur = e.message; d = LS.lire("hub.cache." + n, null); M[n].source = d ? "copie gardée sur cet appareil" : "absent"; } // hors ligne : dernière copie connue
    const br = LS.lire("hub.brouillon." + n, null); if (br) { d = br.d; M[n].attente = true; setTimeout(() => envoyer(n), 1500); } // modifications pas encore envoyées
  } else { d = DEMO?.[n] || null; M[n].source = d ? "démo" : "absent"; }
  D[n] = Object.assign(J.vide(), d && typeof d === "object" && !Array.isArray(d) ? d : {});
}
$("#f-verrou").addEventListener("submit", async e => {
  e.preventDefault(); $("#v-err").textContent = "Vérification…";
  try { GH.jeton = (await dechiffrer(GH.cfg.jetonChiffre, $("#v-pass").value)).jeton; $("#verrou").classList.remove("vu"); $("#v-pass").value = ""; $("#v-err").textContent = ""; charger(); }
  catch { $("#v-err").textContent = "Code incorrect."; }
});
/* Enregistrement : chaque modification part dans le dépôt privé (un commit), avec une copie locale tant que l'envoi n'a pas réussi */
const minuteries = {};
async function sauver(n) {
  if (!GH.pret) return; // mode démonstration : rien n'est enregistré
  M[n].attente = true; LS.ecrire("hub.brouillon." + n, { t: Date.now(), d: D[n] }); rendreNav();
  clearTimeout(minuteries[n]); minuteries[n] = setTimeout(() => envoyer(n), 900);
}
async function envoyer(n) {
  if (M[n].envoi) { M[n].encore = true; return; }
  M[n].envoi = true;
  try {
    GH.shas[n] = await GH.ecrire(`data/${n}.json`, b64(new TextEncoder().encode(JSON.stringify(D[n], null, 1))), GH.shas[n], `Hub : ${JEUX[n].nom}`);
    M[n].attente = false; M[n].erreur = ""; LS.oter("hub.brouillon." + n); LS.ecrire("hub.cache." + n, D[n]);
  } catch (e) {
    M[n].erreur = e.message;
    if (e.status === 409 || e.status === 422) { // le fichier a changé sur un autre appareil
      const distant = await GH.lire(`data/${n}.json`).catch(() => null);
      if (distant && confirm(`« ${JEUX[n].nom} » a été modifié sur un autre appareil.\n\nOK : garder la version de cet appareil.\nAnnuler : prendre l'autre version (tes dernières modifications ici seront perdues).`)) { GH.shas[n] = distant.sha; M[n].envoi = false; return envoyer(n); }
      if (distant) { LS.oter("hub.brouillon." + n); location.reload(); return; }
    }
  }
  M[n].envoi = false; rendreNav();
  if (M[n].encore) { M[n].encore = false; envoyer(n); }
}
function exporter(n) { telecharger(`${n}.json`, JSON.stringify(D[n], null, 2)); toast(`${n}.json téléchargé (copie de sauvegarde)`); }
function bandeau(n) {
  let h = "";
  if (S.demo) h += `<div class="bandeau"><span><b>Mode démonstration.</b> Données d'exemple : rien n'est enregistré tant que ton dépôt privé n'est pas connecté.</span><button class="btn mini plein" data-act="aller" data-v="reglages">Connecter mon dépôt</button></div>`;
  if (M[n]?.erreur) h += `<div class="bandeau"><span><b>Non synchronisé.</b> ${esc(M[n].erreur)}. ${M[n].attente ? "Tes modifications sont gardées sur cet appareil." : "Affichage de la dernière copie connue."}</span><button class="btn mini" data-act="resync">Réessayer</button></div>`;
  return h;
}

/* Fichiers du dépôt privé : envoi, ouverture dans l'application, suppression */
const MIMES = { pdf: "application/pdf", png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp", txt: "text/plain", md: "text/plain", csv: "text/plain", json: "text/plain" };
const ext = n => (String(n).split(".").pop() || "").toLowerCase();
const fTaille = o => o >= 1e6 ? (o / 1e6).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(o / 1e3)) + " ko";
const nomSur = n => String(n).replace(/[\\/:*?"<>|#%]/g, "-").trim();
const TAILLE_MAX = 50e6;
async function televerser(fichier, dossier) {
  if (fichier.size > TAILLE_MAX) throw new Error(`« ${fichier.name} » dépasse 50 Mo : dépose-le plutôt sur ton Drive et colle son lien.`);
  const chemin = `${dossier}/${nomSur(fichier.name)}`; let sha;
  try { sha = (await (await GH.api(GH.u(chemin) + GH.ref())).json()).sha; } catch {} // remplace un fichier du même nom
  await GH.ecrire(chemin, b64(await fichier.arrayBuffer()), sha, `Hub : ajout de ${chemin}`); return chemin;
}
async function ouvrirDoc(chemin) {
  if (/^https?:\/\//.test(chemin)) return window.open(chemin, "_blank", "noopener");
  if (!GH.pret) return toast("Connecte ton dépôt privé pour ouvrir ce fichier");
  toast("Ouverture…"); let blob;
  try { blob = new Blob([await (await GH.api(GH.u(chemin) + GH.ref(), { brut: true })).arrayBuffer()], { type: MIMES[ext(chemin)] || "application/octet-stream" }); } catch (e) { return toast("Impossible d'ouvrir : " + e.message); }
  const url = URL.createObjectURL(blob), nom = chemin.split("/").pop(), e = ext(nom), dlg = $("#dlg");
  if (!MIMES[e]) { const a = document.createElement("a"); a.href = url; a.download = nom; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000); return; }
  dlg.classList.add("grand");
  dlg.innerHTML = `<div class="rang" style="justify-content:space-between;margin-bottom:10px"><b>${esc(nom)}</b><span class="rang"><a class="btn mini" href="${url}" download="${esc(nom)}">Télécharger</a><button class="btn mini plein" id="d_fermer">Fermer</button></span></div>${MIMES[e].startsWith("image") ? `<img src="${url}" alt="${esc(nom)}">` : `<iframe src="${url}" title="${esc(nom)}"></iframe>`}`;
  $("#d_fermer").onclick = () => dlg.close();
  dlg.onclose = () => { dlg.classList.remove("grand"); URL.revokeObjectURL(url); dlg.onclose = null; };
  dlg.showModal();
}
function choisirFichiers(surChoix, accept = "") { const i = document.createElement("input"); i.type = "file"; i.multiple = true; i.accept = accept; i.hidden = true; i.onchange = () => { const F = [...i.files]; i.remove(); if (F.length) surChoix(F); }; document.body.append(i); i.click(); }

/* Liens vers une application installée. Discord : sur ordinateur et sur téléphone. Claude : sur ordinateur seulement
   (les liens de projet ne sont pas documentés pour l'application mobile, qui reçoit donc le lien web).
   Si l'application ne s'ouvre pas, le lien web prend le relais. Réglable dans Réglages > Application. */
const MOBILE = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Mac/i.test(navigator.platform || ""));
function lienApp(u) {
  u = String(u || "");
  let m = u.match(/^https?:\/\/(?:www\.|ptb\.|canary\.)?discord(?:app)?\.com\/channels\/([\w@]+)\/(\d+)(?:\/(\d+))?/i);
  if (m) return `discord://-/channels/${m[1]}/${m[2]}${m[3] ? "/" + m[3] : ""}`;
  m = u.match(/^https?:\/\/claude\.ai\/(?:cowork\/)?project\/([0-9a-f-]{36})/i);
  return m && !MOBILE ? `claude://claude.ai/project/${m[1]}` : "";
}
function ouvrirLien(u) {
  const app = R.liensApp === false ? "" : lienApp(u), web = () => { const w = window.open(u, "_blank"); if (w) w.opener = null; else location.href = u; };
  if (!app) return web();
  let parti = false; const noter = () => { parti = true; };
  addEventListener("blur", noter); addEventListener("pagehide", noter); document.addEventListener("visibilitychange", noter);
  location.href = app;
  setTimeout(() => { removeEventListener("blur", noter); removeEventListener("pagehide", noter); document.removeEventListener("visibilitychange", noter); if (!parti && !document.hidden) web(); }, 1600);
}
const attrApp = u => lienApp(u) ? ' data-act="lien"' : "";

function formulaire(titre, champs, valeurs, surValider, surSupprimer) {
  const dlg = $("#dlg");
  dlg.innerHTML = `<form method="dialog"><h2>${esc(titre)}</h2>${champs.map(c => {
    const v = lire(valeurs, c.k); const id = "f_" + c.k.replace(/\W/g, "_");
    let ctl;

    else if (c.t === "zone") ctl = `<textarea id="${id}" ${c.h ? `style="min-height:${c.h}px"` : ""}>${esc(v)}</textarea>`;
    else if (c.t === "liste") ctl = `<textarea id="${id}" placeholder="Une ligne par élément">${esc(tab(v).join("\n"))}</textarea>`;
    else if (c.t === "tags") ctl = `<input id="${id}" value="${esc(tab(v).join(", "))}" placeholder="Séparés par des virgules">`;
    else if (c.t === "choix") ctl = `<select id="${id}">${c.o.map(o => `<option ${o === v ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
    else ctl = `<input id="${id}" type="${c.t || "text"}" value="${esc(v)}" ${c.t === "color" ? 'style="padding:3px;height:42px"' : ""}>`;
    return `<label class="champ">${esc(c.l)}${ctl}</label>`;
  }).join("")}<div class="rang" style="justify-content:space-between;margin-top:6px"><span>${surSupprimer ? '<button class="btn" type="button" id="f_suppr">Supprimer</button>' : ""}</span><span class="rang"><button class="btn" type="button" id="f_annuler">Annuler</button><button class="btn plein" type="submit">Enregistrer</button></span></div></form>`;
  $("#f_annuler", dlg).onclick = () => dlg.close();
  if (surSupprimer) $("#f_suppr", dlg).onclick = () => { if (confirm("Supprimer définitivement cet élément ?")) { dlg.close(); surSupprimer(); } };
  $("form", dlg).onsubmit = () => {
    const res = JSON.parse(JSON.stringify(valeurs));
    champs.forEach(c => {
      const el = $("#f_" + c.k.replace(/\W/g, "_"), dlg), brut = el.value;
      ecrire(res, c.k, c.t === "fichier" ? [...el.files] : c.t === "liste" ? brut.split("\n").map(s => s.trim()).filter(Boolean) : c.t === "tags" ? brut.split(",").map(s => s.trim()).filter(Boolean) : c.t === "number" ? Number(brut) || 0 : brut.trim());
    });
    surValider(res);
  };
  dlg.showModal();
}

/* ============================================================
   8. Univers 3D : le quartier financier.
      Chaque fiche est une tour de verre, avec son enseigne (logo)

const U = { pret: false, echec: false, actif: false, pause: false, noeuds: [], flux: [], autos: [], liens: [], cibles: [], balises: [], bateaux: [], orb: { th: .85, ph: 1.37, d: 0 }, cons: { th: .85, ph: 1.37, d: 0 }, decal: { x: 0, y: 0 }, survol: null, filtre: null, repos: 0 };
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const modeLeger = () => { // rendu allégé : demandé dans les réglages, ou appareil modeste détecté
  if (R.mode3d !== "auto") return R.mode3d === "leger";
  const coeurs = navigator.hardwareConcurrency || 8, mem = navigator.deviceMemory || 8;
  return coeurs <= 2 || mem <= 2 || (innerWidth < 820 && (coeurs <= 4 || mem <= 3));
};
const mouvementReduit = matchMedia("(prefers-reduced-motion: reduce)").matches;
const estNuit = () => document.documentElement.dataset.theme === "nuit";
const distDefaut = () => (U.w && U.w < U.h ? 150 : 104);

/* Cartes de marché : chaque case est une valeur, sa surface suit son poids dans l'indice,
   sa couleur suit sa variation du jour. Lecture de data/heatmap.json. */
function carreler(items, x, y, w, h) { // algorithme « squarified treemap »
  const total = items.reduce((a, i) => a + i.v, 0), out = []; if (!total || w <= 0 || h <= 0) return out;
  let reste = items.map(i => ({ i, a: i.v * w * h / total }));
  const pire = (r, s, c) => Math.max(c * c * Math.max(...r.map(e => e.a)) / (s * s), s * s / (c * c * Math.min(...r.map(e => e.a))));
  while (reste.length) {
    const court = Math.min(w, h); let rang = [reste[0]], somme = reste[0].a, k = 1;
    while (k < reste.length && pire([...rang, reste[k]], somme + reste[k].a, court) <= pire(rang, somme, court)) { rang.push(reste[k]); somme += reste[k].a; k++; }
    const ep = somme / court; let pos = 0;
    rang.forEach(e => { const l = e.a / ep; out.push(w >= h ? { ...e.i, x, y: y + pos, w: ep, h: l } : { ...e.i, x: x + pos, y, w: l, h: ep }); pos += l; });
    if (w >= h) { x += ep; w -= ep; } else { y += ep; h -= ep; }
    reste = reste.slice(k);
  }
  return out;
}
const fVar = v => v == null || isNaN(v) ? "n.d." : `${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(2).replace(".", ",")} %`;
function cartes() { // cartes par constituants (heatmap.json), puis une carte par classe d'actifs (market.json)

  const groupes = [...new Set(T.map(t => t.groupe).filter(Boolean))];
  return [...tab(D.heatmap?.indices), ...(T.length ? [{ id: "classes", nom: "Tous les marchés, par classe d'actifs", valeurs: T.map(t => val(t, t.groupe || "Autres")) }] : []), ...groupes.map(g => ({ id: "g:" + g, nom: g, valeurs: T.filter(t => t.groupe === g).map(t => val(t, t.sous_groupe || g)) }))];
}

  if (!ind) { z.innerHTML = `<div class="vide"><b>Aucune carte de marché</b>Aucune donnée de marché n'est disponible pour l'instant. Elle sera remplie par le robot de mise à jour.</div>`; return; }
  const seg = (k, opts) => `<div class="seg" role="group">${opts.map(([val, l]) => `<button aria-pressed="${String(c[k]) === String(val)}" data-act="hRegler" data-k="${k}" data-val="${val}">${l}</button>`).join("")}</div>`;
  z.innerHTML = `${H.exemple || D.market?.exemple ? `<div class="bandeau"><span><b>Données d'exemple.</b> Poids indicatifs et variations fictives : la carte sera alimentée au premier passage du robot de mise à jour.</span></div>` : ""}
    <div class="rang" style="margin-bottom:12px"><select class="saisie" style="width:auto" id="hm-indice" aria-label="Indice">${I.map(i => `<option value="${esc(i.id)}" ${i.id === ind.id ? "selected" : ""}>${esc(i.nom)}</option>`).join("")}</select>
      ${seg("taille", [["poids", "Par poids"], ["egale", "Cases égales"]])}${seg("secteurs", [[true, "Par secteur"], [false, "Sans secteur"]])}${seg("echelle", [[1, "±1 %"], [3, "±3 %"], [5, "±5 %"]])}
      <span class="hm-ech">−${c.echelle} %<i></i>+${c.echelle} %</span></div>

function dessinerCarte(ind) {

    html += `<button class="hm-c" data-act="hCase" data-s="${esc(k.symbole)}" title="${esc(k.nom)} · ${fVar(vr)}" aria-label="${esc(k.nom)}, ${fVar(vr)}" style="left:${k.x.toFixed(1)}px;top:${k.y.toFixed(1)}px;width:${k.w.toFixed(1)}px;height:${k.h.toFixed(1)}px;font-size:${taille.toFixed(1)}px;color:${f > .42 ? "#fff" : "var(--encre)"};background:color-mix(in srgb,var(--${vr >= 0 ? "hausse" : "baisse"}) ${Math.round(8 + f * 84)}%,var(--neutre))">${k.w > 26 && k.h > 14 ? `<b>${esc(court)}</b>` : ""}${k.w > 44 && k.h > 32 ? `<span>${fVar(vr)}</span>` : ""}</button>`;

  calImporter: () => formulaire("Importer un emploi du temps SKEMA", [{ k: "texte", l: "Sur la page « My Calendar » de SKEMA (onglet My next classes), sélectionne tout, copie, et colle ici", t: "zone", h: 220 }, { k: "quoi", l: "À importer", t: "choix", o: ["Cours et événements ponctuels", "Tout, y compris les salons sur plusieurs semaines"] }, { k: "rappel", l: "Rappel pour ces événements", t: "choix", o: Object.keys(RAPPELS) }], { texte: "", quoi: "Cours et événements ponctuels", rappel: "30 minutes avant" },
    r => { const res = importerSkema(r.texte, r.quoi.startsWith("Tout"), r.rappel); if (!res.total) { toast("Aucune ligne de cours reconnue dans ce texte"); return; } majCalendrier(); toast(`${res.ajoutes} ajouté${res.ajoutes > 1 ? "s" : ""}, ${res.maj} déjà présent${res.maj > 1 ? "s" : ""} mis à jour`); }),
  calMois: d => { const k = Number(d.k); if (!k) { CAL.jour = isoJour(new Date()); CAL.mois = CAL.jour.slice(0, 7); } else if (CAL.vue !== "mois") { const n = deIso(CAL.jour); n.setDate(n.getDate() + k * (CAL.vue === "semaine" ? 7 : 1)); CAL.jour = isoJour(n); CAL.mois = CAL.jour.slice(0, 7); } else { const [a, m] = CAL.mois.split("-").map(Number), n = new Date(a, m - 1 + k, 1, 12); CAL.mois = isoJour(n).slice(0, 7); } RENDU.calendrier(); },
  calJour: d => { CAL.jour = d.d; CAL.mois = d.d.slice(0, 7); RENDU.calendrier(); },
  calFiltre: d => { CAL.masquees.has(d.c) ? CAL.masquees.delete(d.c) : CAL.masquees.add(d.c); RENDU.calendrier(); },
  calOuvrir: (d, b, ev) => { ev.stopPropagation(); CAL.jour = d.d; RENDU.calendrier(); if (!/^[xr]-/.test(d.id) && innerWidth >= 900) ACT.calEditer({ id: d.id }); },
  calEditer: d => {
    const e = evenements().find(x => x.id === d.id), neuf = !e, noms = categories().map(c => c.nom);
    formulaire(neuf ? "Nouvel événement" : "Modifier l'événement", [{ k: "titre", l: "Titre" }, { k: "date", l: "Date", t: "date" }, { k: "debut", l: "Heure de début (vide : toute la journée)", t: "time" }, { k: "fin", l: "Heure de fin", t: "time" },
      { k: "categorie", l: "Catégorie (donne la couleur)", t: "choix", o: noms }, { k: "icone", l: "Pictogramme (auto : celui de la catégorie)", t: "choix", o: ICONES }, { k: "rappel", l: "Rappel", t: "choix", o: Object.keys(RAPPELS) },
      { k: "repetition", l: "Répétition", t: "choix", o: Object.keys(REPETITIONS) }, { k: "jusqua", l: "Répéter jusqu'au (facultatif)", t: "date" }, { k: "lieu", l: "Lieu ou lien" }, { k: "notes", l: "Notes", t: "zone", h: 70 }],
      e ? Object.assign({ icone: "auto", rappel: "Aucun", repetition: "Aucune" }, e) : { id: uid("e-"), titre: "", date: d.d || CAL.jour, debut: d.h || "", fin: d.f || "", categorie: noms[0], icone: "auto", rappel: "30 minutes avant", repetition: "Aucune", jusqua: "", lieu: "", notes: "" },
      r => { if (!r.titre || !r.date) return; if (neuf) (D.calendrier.evenements ??= []).push(r); else Object.assign(e, r); CAL.jour = r.date; CAL.mois = r.date.slice(0, 7); majCalendrier(); toast(neuf ? "Événement ajouté" : "Événement modifié"); },
      neuf ? null : () => { D.calendrier.evenements = evenements().filter(x => x.id !== e.id); majCalendrier(); });
  },
  calCategorie: d => {
    if (!tab(D.calendrier.categories).length) D.calendrier.categories = CATEGORIES_DEFAUT.map(c => ({ ...c })); // première modification : la liste par défaut devient la tienne
    const L = D.calendrier.categories, c = L.find(x => x.nom === d.c), neuf = !c, avant = c?.nom;
    formulaire(neuf ? "Nouvelle catégorie" : "Modifier la catégorie", [{ k: "nom", l: "Nom" }, { k: "couleur", l: "Couleur", t: "color" }, { k: "icone", l: "Pictogramme", t: "choix", o: ICONES.filter(i => i !== "auto") }], c || { nom: "", couleur: "#27457A", icone: "calendrier" },
      r => { if (!r.nom || (L.some(x => x.nom === r.nom) && r.nom !== avant)) { toast("Nom manquant ou déjà utilisé"); return; } if (neuf) L.push(r); else { Object.assign(c, r); if (avant !== r.nom) evenements().forEach(e => { if (e.categorie === avant) e.categorie = r.nom; }); } majCalendrier(); },
      neuf ? null : () => { D.calendrier.categories = L.filter(x => x !== c); majCalendrier(); });
  },
  calAgenda: d => { const e = [...evenements(), ...evenementsLies()].find(x => x.id === d.id); if (e) versAgenda([e], nomSur(e.titre).slice(0, 40) + ".ics"); },
  calExport: () => { const auj = isoJour(new Date()); versAgenda([...evenements(), ...evenementsLies()].filter(e => e.date >= auj || REPETITIONS[e.repetition]), "calendrier-hub.ics"); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("cal-jour")) { e.preventDefault(); e.target.click(); } });
/* Exemples du mode démonstration, placés autour de la date du jour */
DEMO.calendrier = (() => { const j = n => { const d = new Date(); d.setDate(d.getDate() + n); return isoJour(d); };
  return { version: 1, categories: [], evenements: [
    { id: "e-demo1", titre: "Cours Fixed Income (exemple)", date: j(0), debut: "09:00", fin: "12:00", categorie: "Cours", icone: "auto", rappel: "30 minutes avant", repetition: "Chaque semaine", lieu: "Campus", notes: "" },
    { id: "e-demo2", titre: "Entretien téléphonique (exemple)", date: j(2), debut: "14:30", fin: "15:00", categorie: "Entretien", icone: "telephone", rappel: "1 heure avant", repetition: "Aucune", lieu: "", notes: "Relire la fiche de l'entreprise." },
    { id: "e-demo3", titre: "Révision CFA : Equity (exemple)", date: j(3), debut: "18:00", fin: "20:00", categorie: "CFA", icone: "auto", rappel: "10 minutes avant", repetition: "Aucune", lieu: "", notes: "" },
    { id: "e-demo4", titre: "Rendu du projet ETF (exemple)", date: j(6), debut: "", fin: "", categorie: "Échéance", icone: "auto", rappel: "La veille", repetition: "Aucune", lieu: "", notes: "" },
    { id: "e-demo5", titre: "Dîner (exemple)", date: j(1), debut: "20:00", fin: "", categorie: "Perso", icone: "auto", rappel: "Aucun", repetition: "Aucune", lieu: "", notes: "" }] }; })();

/* ============================================================
   16. Réglages : apparence, vues, connexion au dépôt privé, application
   ============================================================ */
let invite = null; addEventListener("beforeinstallprompt", e => { e.preventDefault(); invite = e; if (S.vue === "reglages") RENDU.reglages(); });
RENDU.reglages = () => {
  const v = $("#v-reglages"), opt = (val, l, cur) => `<option value="${val}" ${cur === val ? "selected" : ""}>${l}</option>`, c = GH.cfg, defaut = location.hostname.endsWith(".github.io") ? location.hostname.split(".")[0] : "";
  v.innerHTML = `<header><div class="sur">Réglages · enregistrés dans ce navigateur</div><h1>Réglages</h1></header>
  <div class="grille" style="grid-template-columns:repeat(auto-fill,minmax(330px,1fr));align-items:start">
    <div class="carte"><h2>Dépôt privé</h2>${GH.pret ? `<p class="petit" style="color:var(--encre2);margin-top:8px">Connecté à <b>${esc(c.proprietaire)}/${esc(c.depot)}</b>, branche ${esc(c.branche || "main")}. Jeton ${c.jetonChiffre ? "protégé par un code" : "enregistré sans code"} sur cet appareil.</p><div class="rang" style="margin-top:10px"><button class="btn" data-act="oublierJeton">Déconnecter cet appareil</button></div>
      <p class="doux petit" style="margin-top:10px">En cas de perte d'un appareil : supprime le jeton sur GitHub (Settings, Developer settings), l'accès est coupé partout.</p>`
      : `<p class="petit" style="color:var(--encre2);margin:8px 0 10px">Tes fiches, contacts, cours et documents vivent dans un dépôt GitHub privé. Colle ici un jeton limité à ce dépôt : il reste dans ce navigateur.</p>
      <form id="f-depot" style="display:grid;gap:10px"><label class="champ">Compte GitHub<input id="g-prop" value="${esc(c?.proprietaire || defaut)}" required autocomplete="off"></label><label class="champ">Dépôt privé<input id="g-depot" value="${esc(c?.depot || "Hub_data")}" required autocomplete="off"></label><label class="champ">Branche<input id="g-branche" value="${esc(c?.branche || "main")}" required autocomplete="off"></label>
      <label class="champ">Jeton d'accès (fine-grained)<input id="g-jeton" type="password" required autocomplete="off" placeholder="github_pat_…"></label><label class="champ">Code de protection sur cet appareil (conseillé)<input id="g-code" type="password" autocomplete="new-password" placeholder="Laisser vide pour ne pas en mettre"></label>
      <p class="baisse petit" id="g-err" role="alert"></p><button class="btn plein" type="submit">Connecter</button></form>
      <p class="doux petit" style="margin-top:10px">Créer le jeton : <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a>. Accès limité au dépôt privé, droit « Contents : lecture et écriture ».</p>`}</div>
    <div class="carte"><h2>Apparence</h2><div style="display:grid;gap:12px;margin-top:12px">
      <label class="champ">Thème<select id="r-theme">${opt("clair", "Jour", R.theme)}${opt("nuit", "Nuit", R.theme)}${opt("auto", "Selon l'appareil", R.theme)}</select></label>
      <label class="champ">Décor de l'univers 3D<select id="r-scene">${opt("reseau", "Réseau de neurones", R.scene3d)}${opt("quartier", "Quartier de La Défense", R.scene3d)}</select></label>
      <label class="champ">Qualité de la 3D<select id="r-3d">${opt("auto", "Automatique (s'adapte à la fluidité)", R.mode3d)}${opt("complet", "Maximale (halo, flou d'arrière-plan, ombres)", R.mode3d)}${opt("leger", "Allégée (appareils modestes)", R.mode3d)}${opt("2d", "Toujours en liste (sans 3D)", R.mode3d)}</select></label>
      <div><span class="petit" style="color:var(--encre2)">Couleurs par type (tours sans couleur propre)</span><div class="rang" style="margin-top:6px">${TYPES.map(t => `<label class="coche"><input type="color" data-coul="${esc(t)}" value="${esc(R.couleurs[t])}" style="width:34px;height:30px;padding:0;border:1px solid var(--trait);border-radius:6px;background:none">${esc(t)}</label>`).join("")}</div></div>
    </div></div>
    <div class="carte"><h2>Vues et ordre</h2><p class="doux petit">Décoche une vue pour la masquer, utilise les flèches pour changer l'ordre du menu.</p>
      ${R.ordre.filter(id => VUES.some(x => x.id === id)).map((id, i, a) => `<div class="rang" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--trait)"><label class="coche"><input type="checkbox" data-vis="${id}" ${R.masquees.includes(id) ? "" : "checked"} ${id === "reglages" ? "disabled" : ""}>${esc(VUES.find(x => x.id === id).nom)}</label><span class="rang"><button class="btn mini" data-act="rOrdre" data-id="${id}" data-s="-1" ${i === 0 ? "disabled" : ""} aria-label="Monter ${esc(id)}">↑</button><button class="btn mini" data-act="rOrdre" data-id="${id}" data-s="1" ${i === a.length - 1 ? "disabled" : ""} aria-label="Descendre ${esc(id)}">↓</button></span></div>`).join("")}
    </div>
    <div class="carte"><h2>Application</h2><p class="petit" style="color:var(--encre2);margin:8px 0 10px">Installe le hub comme une application : icône, plein écran, ouverture même hors ligne.</p>
      ${invite ? '<button class="btn plein" data-act="rInstaller">Installer l\'application</button>' : '<p class="doux petit">Sur PC (Chrome ou Edge) : icône d\'installation dans la barre d\'adresse. Sur Android : menu du navigateur, « Installer l\'application ». Sur iPhone (Safari) : Partager, puis « Sur l\'écran d\'accueil ».</p>'}
      <label class="coche" style="margin-top:14px"><input type="checkbox" id="r-liens" ${R.liensApp === false ? "" : "checked"}>Ouvrir Discord et Claude dans leur application plutôt que dans le navigateur</label>
      <h3 style="margin:18px 0 6px">Réglages</h3><div class="rang"><button class="btn" data-act="rExport">Exporter</button><button class="btn" data-act="rImport">Importer</button><button class="btn" data-act="rReset">Réinitialiser</button></div>
      <h3 style="margin:18px 0 6px">Données</h3>${Object.keys(JEUX).map(n => `<div class="rang" style="justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--trait)"><span>${esc(JEUX[n].nom)} <span class="doux petit">· ${esc(M[n]?.source || "")}${M[n]?.attente ? " · envoi en attente" : ""}</span></span><button class="btn mini" data-act="exporter" data-n="${n}">Copie</button></div>`).join("")}
      <input type="file" id="r-fichier" accept="application/json" hidden></div>
  </div>`;
  $("#r-theme").onchange = e => { R.theme = e.target.value; sauverReglages(); appliquerTheme(); };
  $("#r-liens").onchange = e => { R.liensApp = e.target.checked; sauverReglages(); };
  $("#r-scene").onchange = e => { R.scene3d = e.target.value; sauverReglages(); location.reload(); };
  $("#r-3d").onchange = e => { R.mode3d = e.target.value; sauverReglages(); location.reload(); };
  $$("[data-coul]", v).forEach(i => i.onchange = () => { R.couleurs[i.dataset.coul] = i.value; sauverReglages(); });
  $$("[data-vis]", v).forEach(i => i.onchange = () => { R.masquees = i.checked ? R.masquees.filter(x => x !== i.dataset.vis) : [...R.masquees, i.dataset.vis]; sauverReglages(); rendreNav(); });
  $("#r-fichier").onchange = async e => { try { const o = JSON.parse(await e.target.files[0].text()); R = Object.assign({}, REGLAGES_DEFAUT, o); sauverReglages(); location.reload(); } catch { alert("Fichier de réglages illisible."); } };
  const f = $("#f-depot"); if (f) f.onsubmit = async e => {
    e.preventDefault(); const err = $("#g-err"); err.textContent = "Vérification…";
    const cfg = { proprietaire: $("#g-prop").value.trim(), depot: $("#g-depot").value.trim(), branche: $("#g-branche").value.trim() || "main" }, jeton = $("#g-jeton").value.trim(), code = $("#g-code").value, avant = [GH.cfg, GH.jeton];
    try {
      GH.cfg = cfg; GH.jeton = jeton; const info = await (await GH.api("")).json();
      if (!info.private) throw new Error("Ce dépôt est public. Choisis un dépôt privé pour tes données.");
      LS.ecrire("hub.depot", code ? { ...cfg, jetonChiffre: await chiffrer({ jeton }, code) } : { ...cfg, jeton }); location.reload();
    } catch (x) { [GH.cfg, GH.jeton] = avant; err.textContent = x.status === 404 ? "Dépôt introuvable avec ce jeton : vérifie le nom du dépôt et que le jeton y a accès." : x.message; }
  };
};
Object.assign(ACT, {
  rOrdre: d => { const i = R.ordre.indexOf(d.id), j = i + +d.s; [R.ordre[i], R.ordre[j]] = [R.ordre[j], R.ordre[i]]; sauverReglages(); RENDU.reglages(); rendreNav(); },
  oublierJeton: () => { if (confirm("Retirer le jeton de cet appareil ? Tes données restent intactes dans le dépôt privé.")) { LS.oter("hub.depot"); Object.keys(JEUX).forEach(n => { LS.oter("hub.cache." + n); LS.oter("hub.brouillon." + n); }); location.reload(); } },
  rInstaller: async () => { if (invite) { invite.prompt(); await invite.userChoice; invite = null; RENDU.reglages(); } },
  rExport: () => telecharger("hub-reglages.json", JSON.stringify(R, null, 2)),
  rImport: () => $("#r-fichier").click(),
  rReset: () => { if (confirm("Revenir aux réglages d'origine ? Tes données ne sont pas touchées.")) { LS.oter("hub.reglages"); location.reload(); } }
});

if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {}); // application installable et ouverture hors ligne
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", appliquerTheme);
appliquerTheme();
charger();
</script>
